name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_FIREBASE_API_KEY: "AIzaSyD71H8mkXIHc_zY1UspZBUMwKnZ9bZEJnI"
          VITE_FIREBASE_AUTH_DOMAIN: "gen-lang-client-0252940162.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "gen-lang-client-0252940162"
          VITE_FIREBASE_STORAGE_BUCKET: "gen-lang-client-0252940162.appspot.com"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "606863797162"
          VITE_FIREBASE_APP_ID: "1:606863797162:web:4fd5570fbab38afc8b59d3"

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages

